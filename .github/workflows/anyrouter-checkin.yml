name: AnyRouter Daily Check-in

on:
  workflow_dispatch:
  schedule:
    # UTC 02:15 = 北京时间 10:15；GitHub 定时任务可能延迟。
    - cron: '15 2 * * *'

permissions:
  contents: read

concurrency:
  group: anyrouter-daily-checkin
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/anyrenew-browsers
    steps:
      - name: Check out workflow code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run offline tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Install browser only on the temporary runner
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/anyrenew-venv"
          "$RUNNER_TEMP/anyrenew-venv/bin/python" -m pip install --no-cache-dir --disable-pip-version-check -r requirements-browser.txt
          "$RUNNER_TEMP/anyrenew-venv/bin/python" -m playwright install --with-deps chromium

      - name: Check in with an isolated browser
        env:
          ANYROUTER_COOKIE: ${{ secrets.ANYROUTER_COOKIE }}
          ANYROUTER_USER_ID: ${{ secrets.ANYROUTER_USER_ID }}
        shell: bash
        run: '"$RUNNER_TEMP/anyrenew-venv/bin/python" -B scripts/checkin.py'
